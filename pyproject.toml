[project]
name = "neugate"
version = "0.1.0"
description = "Semantic filter proxy — pre-backend intent and safety gate"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.55.0",
  "jsonschema>=4.23.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
agentic = [
  "sentence-transformers>=3.0.0,<4",
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.0,<2",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast tests without HTTP (schema, pure logic)",
  "integration: API tests with mocked LLM",
  "agentic: tests requiring FAISS index and embedding model",
]
